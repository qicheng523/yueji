  function builtinDemo() {
    // 造一份"像那么回事"的两个月账单：以大食堂为主，偶尔奶茶/外卖/购物，
    // 每月固定几笔订阅，月初一笔生活费。金额总计控制在 1200~1500 左右。
    var out = [];
    var now = new Date();
    var seed = 20261116;

    function rnd() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return (seed >>> 8) / 16777216;
    }
    function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
    function around(base, spread) { return Math.round((base + (rnd() - 0.5) * spread) / 10) * 10; }

    var canteen = [
      ['一食堂', 1000, 500, 1600], ['二食堂麻辣香锅', 1600, 400, 2400],
      ['三食堂', 1100, 400, 1800], ['一食堂 面窗口', 900, 300, 1500]
    ];
    var takeout = [['美团外卖', 2100, 400, 3600], ['饿了么', 1900, 400, 3200]];
    var drink = [['蜜雪冰城', 600, 100, 900], ['瑞幸咖啡', 1500, 300, 2600], ['古茗', 1100, 200, 1900]];
    var extra = [
      ['海底捞', 'social', 12000, 4000, 18000], ['猫眼电影', 'fun', 4500, 2000, 9000],
      ['淘宝', 'shopping', 9900, 6000, 20000], ['天猫超市', 'daily', 4200, 2000, 7500],
      ['永辉超市', 'daily', 3800, 2000, 6500], ['全家便利店', 'daily', 1300, 600, 2500],
      ['滴滴出行', 'transport', 2400, 800, 4500], ['学校书店', 'study', 4500, 1500, 8000],
      ['拼多多', 'shopping', 2900, 1000, 5500], ['蜜雪冰城', 'food', 700, 200, 1200]
    ];
    var fixed = [
      ['腾讯视频', 'fun', 2500, 'VIP 连续包月'], ['爱奇艺', 'fun', 1900, '黄金会员 连续包月'],
      ['校园网', 'phone', 3000, '校园网续费'], ['中国移动', 'phone', 3000, '话费']
    ];

    for (var back = 95; back >= 0; back--) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back);
      var dom = d.getDate();
      var wd = d.getDay();
      function at(h, m) { return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m, 0, 0).getTime(); }

      // 早饭 + 午饭 + 晚饭（周末起得晚，少一顿）
      var meals = wd === 0 || wd === 6 ? 2 : 3;
      for (var mi = 0; mi < meals; mi++) {
        var b = pick(canteen);
        var lo = Math.min(b[1], b[3]), hi = Math.max(b[1], b[3]);
        var base = mi === 0 ? 550 : lo + (hi - lo) * 0.62;
        out.push({ ts: at(mi === 0 ? 7 : mi === 1 ? 12 : 18, 5 + Math.floor(rnd() * 40)),
          amountFen: around(base, mi === 0 ? 160 : Math.min(800, hi - lo)), cat: 'food',
          merchant: b[0], note: mi === 0 ? '早餐' : mi === 1 ? '午饭' : '晚饭' });
      }

      // 奶茶/咖啡 约 40%
      if (rnd() < 0.5) {
        var dr = pick(drink);
        out.push({ ts: at(15, 10 + Math.floor(rnd() * 40)), amountFen: around(dr[1], 300), cat: 'food', merchant: dr[0], note: '下午一杯' });
      }
      // 外卖 约 30%
      if (rnd() < 0.34) {
        var to = pick(takeout);
        out.push({ ts: at(19, 20 + Math.floor(rnd() * 30)), amountFen: around(to[1], 600), cat: 'food', merchant: to[0], note: '晚饭外卖' });
      }
      // 每周一笔"额外的"
      if ((wd === 6 || wd === 0) && rnd() < 0.75) {
        var ex = pick(extra);
        out.push({ ts: at(15, 10 + Math.floor(rnd() * 40)), amountFen: around(ex[2], ex[3]),
          cat: ex[1], merchant: ex[0], note: ex[1] === 'social' ? '和室友聚餐' : ex[1] === 'fun' ? '看电影' : '补充点东西' });
      }
      // 上月 25 号左右交话费/续会员
      if (dom === 25) {
        fixed.forEach(function (f, fi) {
          out.push({ ts: at(10, 30 + fi * 7), amountFen: f[2], cat: f[1], merchant: f[0], note: f[3], sub: true });
        });
      }
    }

    // 生活费
    function payday(offset) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - offset);
      d.setDate(1); d.setHours(9, 30, 0, 0);
      out.push({ ts: d.getTime(), amountFen: 150000, cat: 'other', merchant: '生活费', note: '家里打的生活费', dir: 'in' });
    }
    payday(0);
    payday(new Date(now.getFullYear(), now.getMonth(), 0).getDate());

    out.sort(function (x, y) { return x.ts - y.ts; });
    return out;
  }

  /* =========================================================
   * 事件绑定
   * ========================================================= */
  function bind() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-go]');
      if (t) { e.preventDefault(); go(t.dataset.go); return; }

      var tab = e.target.closest('.tab');
      if (tab) { go(tab.dataset.page); return; }

      var hm = e.target.closest('[data-month]');
      if (hm) {
        var hd = Number(hm.dataset.month);
        var hnext = C.shiftMonth(state.view.month, hd);
        if (hnext > nowMonth() || hnext < '2020-01') return;
        state.view.month = hnext;
        homeSig = '';
        renderHome();
        return;
      }

      var mv = e.target.closest('[data-mv]');
      if (mv) {
        var delta = Number(mv.dataset.mv);
        var cur = state.view.page === 'ledger' ? (state.view.ledgerMonth || nowMonth()) : state.view.month;
        var next = C.shiftMonth(cur, delta);
        if (next > nowMonth() || next < '2020-01') return;
        if (state.view.page === 'ledger') state.view.ledgerMonth = next;
        else { state.view.month = next; homeSig = ''; }
        renderCurrent();
        return;
      }

      var fc = e.target.closest('[data-fc]');
      if (fc) { state.view.filterCat = fc.dataset.fc; renderLedger(); return; }

      var tk = e.target.closest('[data-tx]');
      if (tk) { openSheet(tk.dataset.tx); return; }

      var qk = e.target.closest('[data-quick]');
      if (qk) { form.cat = qk.dataset.quick; openSheet(); return; }

      var cb = e.target.closest('[data-cat]');
      if (cb) {
        form.cat = cb.dataset.cat;
        renderCatGrid();
        updateClassifyHint();
        return;
      }

      var ds = e.target.closest('#dirSeg button');
      if (ds) {
        form.dir = ds.dataset.dir;
        renderDirSeg();
        renderCatGrid();
        return;
      }

      var ws = e.target.closest('#whenSeg button');
      if (ws) {
        form.when = ws.dataset.when;
        renderWhenSeg();
        if (form.when === 'custom') {
          $('#fWhen').value = toLocalInput(Date.now());
          $('#fWhen').showPicker && $('#fWhen').showPicker();
        }
        return;
      }

      var ps = e.target.closest('#paySeg button');
      if (ps) { form.pay = ps.dataset.pay; renderPaySeg(); return; }

      var tag = e.target.closest('[data-tag]');
      if (tag) {
        $('#fMerchant').value = tag.dataset.tag;
        form.cat = tag.dataset.tagcat;
        renderCatGrid();
        updateClassifyHint();
        return;
      }

      var ac = e.target.closest('[data-applycat]');
      if (ac) {
        e.preventDefault();
        form.cat = ac.dataset.applycat;
        renderCatGrid();
        $('#classifyHint').textContent = '';
        return;
      }

      var act = e.target.closest('[data-act]');
      if (act) {
        var a = act.dataset.act;
        if (a === 'import') openImport();
        else if (a === 'close-import') closeImport();
        else if (a === 'export-csv') exportCSV();
        else if (a === 'report') monthlyReport();
        else if (a === 'export-json') exportJSON();
        else if (a === 'trash') openTrash();
        else if (a === 'demo') loadDemo();
        else if (a === 'import-reset') { openImport(); }
        else if (a === 'do-import') doImport();
        else if (a === 'import-demo') {
          var txt = demoCSV();
          importState.payload = txt;
          importState.platform = 'auto';
          importState.fileName = '示例-支付宝账单.csv';
          importState.parsed = C.parseBill(txt);
          renderPreview();
        }
        else if (a === 'wipe') wipe();
        else if (a === 'import-json') { var ji = $('#jsonInput'); if (ji) ji.click(); }
        else if (a === 'add-cat') addCategory();
        else if (a === 'cat-manager') openCatManager();
        else if (a === 'self-check') openSelfCheck();
        else if (a === 'storage-help') openStorageHelp();
        else if (a === 'android-help') openStorageHelp();
        else if (a === 'export-cats') exportCategories();
        else if (a === 'reset-cats') resetCats();
        return;
      }

      var hide = e.target.closest('[data-hide]');
      if (hide) {
        var hid = hide.dataset.hide;
        var hc = (state.settings.categories || []).find(function (x) { return x.id === hid; });
        if (hc) {
          hc.hidden = !hc.hidden;
          applyCategories();
          touch();
          renderSettings();
          toast(hc.hidden ? '已隐藏「' + hc.name + '」' : '已显示「' + hc.name + '」');
        }
        return;
      }

      var editEmoji = e.target.closest('[data-editemoji]');
      if (editEmoji) { editCatEmoji(editEmoji.dataset.editemoji); return; }

      var kwCat = e.target.closest('[data-kwcat]');
      if (kwCat) { editCatKeywords(kwCat.dataset.kwcat); return; }

      var editCatEl = e.target.closest('[data-editcat]');
      if (editCatEl) { editCat(editCatEl.dataset.editcat); return; }

      var mvCat = e.target.closest('[data-mvcat]');
      if (mvCat) { moveCat(mvCat.dataset.mvcat, Number(mvCat.dataset.dir)); return; }

      var delCat = e.target.closest('[data-delcat]');
      if (delCat) { deleteCat(delCat.dataset.delcat); return; }

      var th = e.target.closest('#themeSeg [data-theme]');
      if (th) {
        state.settings.theme = th.dataset.theme;
        save(true); applyTheme(); renderSettings();
        return;
      }

      var pv = e.target.closest('[data-privacy]');
      if (pv) {
        state.settings.privacy = !state.settings.privacy;
        state.hidden = state.settings.privacy;
        save(true); renderSettings(); applyPrivacy();
        return;
      }

      var rs = e.target.closest('[data-restore]');
      if (rs) {
        var tx = state.tx.find(function (x) { return x.id === rs.dataset.restore; });
        if (tx) { tx.deletedAt = 0; save(true); closeImport(); renderCurrent(); toast('已恢复'); }
        return;
      }
    });

    $('#fab').addEventListener('click', function () { openSheet(); });
    $('#mask').addEventListener('click', function () { closeSheet(); closeImport(); });

    $('#btnSave').addEventListener('click', saveTx);
    $('#btnDelete').addEventListener('click', function () {
      if (state.editing) deleteTx(state.editing.id);
    });

    $('#fAmount').addEventListener('input', function (e) {
      var v = e.target.value.replace(/[^\d.]/g, '');
      var parts = v.split('.');
      if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
      if (parts[1] && parts[1].length > 2) v = parts[0] + '.' + parts[1].slice(0, 2);
      e.target.value = v;
    });
    $('#fAmount').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); saveTx(); }
    });
    $('#fMerchant').addEventListener('input', debounce(updateClassifyHint, 200));
    $('#fMerchant').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); saveTx(); }
    });

    $('#btnTheme').addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      state.settings.theme = dark ? 'light' : 'dark';
      save(true); applyTheme();
    });
    $('#btnPrivacy').addEventListener('click', function () {
      state.hidden = !state.hidden;
      applyPrivacy();
      toast(state.hidden ? '金额已隐藏' : '金额已显示');
    });

    // 文件
    document.addEventListener('change', function (e) {
      if (e.target.id === 'fileInput' && e.target.files && e.target.files[0]) {
        readFile(e.target.files[0]);
      }
      if (e.target.id === 'jsonInput' && e.target.files && e.target.files[0]) {
        importJSON(e.target.files[0]);
        e.target.value = '';
      }
    });

    // ESC 关闭
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeSheet(); closeImport(); }
    });

    // 拖拽导入
    ['dragover', 'drop'].forEach(function (ev) {
      document.addEventListener(ev, function (e) {
        e.preventDefault();
        if (ev === 'drop' && e.dataTransfer && e.dataTransfer.files[0]) {
          var f = e.dataTransfer.files[0];
          if (!document.body.classList.contains('importing')) { openImport(); document.body.classList.add('importing'); }
          setTimeout(function () { readFile(f); }, 60);
        }
      });
    });
  }

  function demoCSV() {
    return '交易时间,交易分类,交易对方,商品说明,收/支,金额,收/付款方式,交易状态,交易订单号\n' +
      '2026-11-15 12:10:00,餐饮美食,一食堂,午餐,支出,13.00,余额宝,交易成功,A1\n' +
      '2026-11-15 19:00:00,餐饮美食,美团外卖,麻辣烫,支出,24.50,余额宝,交易成功,A2\n' +
      '2026-11-14 09:00:00,交通出行,上海地铁,地铁,支出,4.00,余额宝,交易成功,A3\n' +
      '2026-11-13 16:00:00,日用百货,天猫超市,抽纸,支出,45.80,余额宝,交易成功,A4\n' +
      '2026-11-12 20:00:00,文化休闲,猫眼电影,电影票,支出,45.00,余额宝,交易成功,A5\n' +
      '2026-11-11 08:00:00,教育培训,学校书店,四六级真题,支出,45.00,余额宝,交易成功,A6\n' +
      '2026-11-10 22:00:00,转账红包,张三,转账,不计收支,100.00,余额宝,交易成功,A7\n' +
      '2026-11-09 12:00:00,餐饮美食,蜜雪冰城,柠檬水,支出,6.00,余额宝,交易成功,A8\n';
  }

  /* =========================================================
   * 启动
   * ========================================================= */
  function init() {
    load();
    probeStorage();
    setupPWA();
    applyCategories();
    applyPrivacyCss();
    applyTheme();
    ensureImportSheet();
    bind();

    // 首页月份跟随当前月
    state.view.month = nowMonth();
    state.view.ledgerMonth = nowMonth();

    if (state.settings.privacy) state.hidden = true;

    renderCurrent();

    // ?demo=1 直接看示例数据（方便截图/试用）；?page=stats 直接到某页
    try {
      var qs = new URLSearchParams(location.search);
      if (qs.get('demo') === '1' && !state.tx.length) {
        demoMode = true;
        state.tx = builtinDemo().map(function (d) {
          var g = C.classify({ merchant: d.merchant, note: d.note }, {});
          return {
            id: C.uid(), ts: d.ts, amountFen: d.amountFen,
            dir: d.dir || 'out', cat: C.CAT_BY_ID[d.cat] ? d.cat : 'other',
            merchant: d.merchant, note: d.note || '',
            method: d.method || '支付宝', source: 'demo',
            fp: C.fingerprint({ ts: d.ts, amountFen: d.amountFen, merchant: d.merchant }),
            conf: 1, createdAt: Date.now()
          };
        });
        state.rev++;
        homeSig = '';
        renderCurrent();
      }
      var pg = qs.get('page');
      if (pg && ['home', 'ledger', 'stats', 'settings'].indexOf(pg) >= 0) go(pg);
      if (qs.get('theme') === 'dark') { state.settings.theme = 'dark'; applyTheme(); }
      if (qs.get('sheet') === '1') setTimeout(function () { openSheet(); }, 60);
      if (qs.get('sheet') === 'cats') setTimeout(function () { openCatManager(); }, 80);
      if (qs.get('sheet') === 'check') setTimeout(function () { openSelfCheck(); }, 80);
    } catch (e) { }

    // 首次使用引导
    if (!state.tx.length && !localStorage.getItem(STORAGE_KEY + '.seen')) {
      try { localStorage.setItem(STORAGE_KEY + '.seen', '1'); } catch (e) { }
    }

    if (matchMedia) {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      var handler = function () { if ((state.settings.theme || 'auto') === 'auto') applyTheme(); };
      mq.addEventListener ? mq.addEventListener('change', handler) : mq.addListener(handler);
    }
  }

  function ensureImportSheet() {
    if ($('#importSheet')) return;
    var div = document.createElement('div');
    div.className = 'sheet';
    div.id = 'importSheet';
    div.setAttribute('role', 'dialog');
    div.setAttribute('aria-label', '导入账单');
    document.body.appendChild(div);
  }

  // 暴露给调试/截图
  window.YueJi = {
    state: state, go: go, openSheet: openSheet, loadDemo: loadDemo,
    addDemo: function () { bootDemo(builtinDemo()); },
    exportCSV: exportCSV,
    // 自测/调试：直接把 ArrayBuffer 送进导入流程（xlsx 或 csv）
    importBuffer: function (buf, name) { openImport(); return loadBuffer(buf, name); },
    // 调试/自测用：把内置示例账单直接送进导入预览
    demoImport: function () {
      openImport();
      importState.payload = demoCSV();
      importState.platform = 'auto';
      importState.fileName = '示例-支付宝账单.csv';
      importState.parsed = C.parseBill(importState.payload);
      renderPreview();
    }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
