<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="月记">
<meta name="description" content="大学生月度开销记录：导入支付宝/微信账单自动分类，现金与校园卡 3 秒补记。">
<title>月记 · 大学生月度开销</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<style>/* ==========================================================================
   月记 · 样式
   移动端优先；桌面端居中成一张"手机卡片"
   ========================================================================== */

:root {
  --bg: #f4f6f1;
  --bg-grad: radial-gradient(120% 80% at 100% 0%, #e6f4ea 0%, rgba(244, 246, 241, 0) 55%),
             radial-gradient(100% 60% at 0% 100%, #eef2fb 0%, rgba(244, 246, 241, 0) 60%);
  --card: #ffffff;
  --card-soft: #f7f9f6;
  --ink: #12211b;
  --ink-2: #3d5148;
  --ink-3: #738077;
  --line: #e4e9e3;
  --accent: #0f766e;
  --accent-2: #14b8a6;
  --accent-soft: #e3f4f0;
  --danger: #e11d48;
  --warn: #d97706;
  --shadow: 0 1px 2px rgba(18, 33, 27, .04), 0 8px 24px -12px rgba(18, 33, 27, .18);
  --shadow-up: 0 -8px 30px -18px rgba(18, 33, 27, .35);
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --nav-h: 62px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei UI", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
  --num: "SF Pro Display", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

html[data-theme="dark"] {
  --bg: #0c1210;
  --bg-grad: radial-gradient(120% 80% at 100% 0%, #10312a 0%, rgba(12, 18, 16, 0) 55%),
             radial-gradient(100% 60% at 0% 100%, #141c2b 0%, rgba(12, 18, 16, 0) 60%);
  --card: #141d1a;
  --card-soft: #1a2521;
  --ink: #eaf2ee;
  --ink-2: #b9c8c1;
  --ink-3: #84958d;
  --line: #243029;
  --accent: #2dd4bf;
  --accent-2: #5eead4;
  --accent-soft: #12302b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .7);
  --shadow-up: 0 -8px 30px -18px rgba(0, 0, 0, .9);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100dvh;
  background-image: var(--bg-grad);
  overflow-x: hidden;
}
@media (min-width: 760px) { body { background-attachment: fixed; } }

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; padding: 0; }
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent-soft); color: var(--ink); }

/* ---------------- 布局 ---------------- */
.shell {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  background: transparent;
}

.appbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + var(--safe-t)) 18px 8px;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(to bottom, var(--bg) 62%, transparent);
  backdrop-filter: blur(8px);
}
.appbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .2px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 9px;
  background: linear-gradient(140deg, var(--accent-2), var(--accent));
  color: #fff; font-size: 15px; font-weight: 800;
  display: grid; place-items: center;
  box-shadow: 0 4px 10px -4px rgba(15, 118, 110, .7);
}
.brand small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-3); letter-spacing: 0; }
.appbar .spacer { flex: 1; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center;
  color: var(--ink-2);
  background: var(--card);
  box-shadow: var(--shadow);
  transition: transform .15s ease, background .2s;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 19px; height: 19px; }

main { padding: 4px 16px calc(var(--nav-h) + 34px + var(--safe-b)); }

/* ---------------- 通用 ---------------- */
.card {
  background: var(--card);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  border: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
}
.pad { padding: 16px 18px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.section-t { font-size: 14px; font-weight: 700; margin: 22px 2px 10px; display: flex; align-items: center; gap: 8px; }
.section-t .count { font-weight: 500; color: var(--ink-3); font-size: 12px; }
.section-t .more { margin-left: auto; font-weight: 500; font-size: 12.5px; color: var(--accent); }
.hide { display: none !important; }

.empty {
  text-align: center; padding: 34px 20px; color: var(--ink-3);
}
.empty .big { font-size: 40px; margin-bottom: 8px; }

/* ---------------- 首页 Hero ---------------- */
.hero {
  position: relative; overflow: hidden;
  padding: 20px;
  border-radius: 26px;
  background:
    radial-gradient(120% 130% at 88% -20%, rgba(45, 212, 191, .35) 0%, rgba(45, 212, 191, 0) 52%),
    linear-gradient(150deg, #0f766e 0%, #0b5f5a 55%, #0a4f4c 100%);
  color: #eafffb;
  box-shadow: 0 18px 40px -24px rgba(6, 78, 74, .9);
  border: 1px solid rgba(255, 255, 255, .08);
}
html[data-theme="dark"] .hero {
  background:
    radial-gradient(120% 130% at 88% -20%, rgba(45, 212, 191, .28) 0%, rgba(45, 212, 191, 0) 52%),
    linear-gradient(150deg, #10433f 0%, #0c2f2d 60%, #0a2523 100%);
}
.hmonth {
  width: 26px; height: 26px; border-radius: 9px;
  display: grid; place-items: center;
  color: #d7f5ef; font-size: 15px; line-height: 1;
  background: rgba(255, 255, 255, .12);
  border: 1px solid rgba(255, 255, 255, .14);
}
.hmonth:active { background: rgba(255, 255, 255, .22); }
.hmonth[disabled] { opacity: .3; pointer-events: none; }
.hero .month {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: #b8ece3;
  background: rgba(255, 255, 255, .1);
  padding: 4px 10px; border-radius: 999px;
}
.hero .label { font-size: 12.5px; color: #a9ddd5; margin-top: 10px; letter-spacing: .4px; }
.hero .amount {
  font-family: var(--num); font-weight: 700; line-height: 1.05;
  font-size: clamp(30px, 10.4vw, 42px);
  letter-spacing: -1.4px; margin: 2px 0 0; display: flex; align-items: baseline; gap: 3px;
  max-width: 100%; overflow: hidden;
}
.hero .amount .num { white-space: nowrap; }
.hero .amount .cur { font-size: .5em; font-weight: 600; opacity: .85; letter-spacing: 0; }
.hero .amount .dec { font-size: .42em; font-weight: 600; opacity: .78; }
.hero .sub { font-size: 11.5px; color: #a9ddd5; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 3px 9px; line-height: 1.45; }
.hero .sub b { color: #eafffb; font-weight: 600; }
.hero .ring-wrap {
  position: absolute; right: -6px; bottom: -14px;
  width: 132px; height: 132px; opacity: .95;
}
.hero .ring { width: 100%; height: 100%; }
.hero .ring text { font-family: var(--num); }

.budget-line {
  margin-top: 16px; padding-top: 14px;
  border-top: 1px dashed rgba(255, 255, 255, .18);
}
.budget-line .bar {
  height: 7px; border-radius: 99px; background: rgba(255, 255, 255, .16);
  overflow: hidden; margin: 8px 0 7px;
}
.budget-line .bar i {
  display: block; height: 100%; border-radius: 99px;
  background: linear-gradient(90deg, #5eead4, #fbbf24);
  transition: width .6s cubic-bezier(.2, .8, .2, 1);
}
.budget-line .bar.over i { background: linear-gradient(90deg, #fb7185, #f43f5e); }
.budget-line .txt { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: #b8ece3; }
.budget-line .txt b { color: #fff; }

/* ---------------- 快捷分类 ---------------- */
.quick-scroll {
  margin: 0 -16px; padding: 2px 16px 4px;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}
.quick-scroll::-webkit-scrollbar { display: none; }
.quick-grid {
  display: flex; gap: 8px;
}
.quick {
  flex: 0 0 auto; width: 84px;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 12px 4px 10px;
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  border: 1px solid color-mix(in srgb, var(--line) 50%, transparent);
  transition: transform .12s ease;
  scroll-snap-align: start;
}
.quick:active { transform: scale(.95); }
.quick .e { font-size: 22px; line-height: 1.05; }
.quick .n { font-size: 11.5px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.quick .c { font-size: 10px; color: var(--ink-3); font-family: var(--num); white-space: nowrap; }
@media (min-width: 600px) {
  .quick-grid { flex: 1; }
  .quick { flex: 1 1 0; width: auto; min-width: 0; }
  .quick .e { font-size: 20px; }
  .quick .n { font-size: 11px; }
  .quick .c { font-size: 9.5px; }
}

/* ---------------- 交易列表 ---------------- */
.day-group { margin-bottom: 18px; }
.day-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 0 4px 7px; font-size: 12px; color: var(--ink-3);
}
.day-head .d { font-weight: 600; color: var(--ink-2); font-size: 13px; }
.day-head .sum { margin-left: auto; font-family: var(--num); }

.tx-card { overflow: hidden; }
.tx {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  width: 100%; text-align: left;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
  transition: background .12s;
}
.tx:last-child { border-bottom: 0; }
.tx:active { background: var(--card-soft); }
.tx .ico {
  width: 38px; height: 38px; flex: none; border-radius: 13px;
  display: grid; place-items: center; font-size: 18px;
  background: var(--card-soft);
}
.tx .mid { min-width: 0; flex: 1; }
.tx .name {
  font-size: 14.5px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tx .meta {
  font-size: 11.5px; color: var(--ink-3); margin-top: 1px;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.tx .meta .dot { opacity: .5; }
.tx .amt {
  font-family: var(--num); font-weight: 650; font-size: 15px; white-space: nowrap;
  letter-spacing: -.2px;
}
.tx .amt.in { color: #0d9488; }
.tx .amt.out { color: var(--ink); }
.tag {
  font-size: 10px; padding: 1px 5px; border-radius: 5px;
  background: var(--accent-soft); color: var(--accent);
  font-weight: 600; letter-spacing: .2px;
}
.tag.warn { background: #fef3c7; color: #b45309; }
html[data-theme="dark"] .tag.warn { background: #3a2a0c; color: #fbbf24; }
.tag.gray { background: var(--card-soft); color: var(--ink-3); }

/* ---------------- 统计 ---------------- */
.donut-wrap { display: flex; align-items: center; gap: 18px; }
.donut {
  --p: 0; --c1: transparent; --c2: transparent; --c3: transparent; --c4: transparent; --c5: transparent;
  width: 128px; height: 128px; flex: none; border-radius: 50%;
  background: conic-gradient(var(--c1) 0, var(--c2) 0, var(--c3) 0, var(--c4) 0, var(--c5) 0, var(--card-soft) 0);
  position: relative;
  -webkit-mask: radial-gradient(circle 41px at center, transparent 99%, #000 100%);
          mask: radial-gradient(circle 41px at center, transparent 99%, #000 100%);
}
.donut-center {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}
.donut-center .k { font-size: 10.5px; color: var(--ink-3); }
.donut-center .v { font-family: var(--num); font-weight: 700; font-size: 17px; letter-spacing: -.4px; }

.cat-list { display: flex; flex-direction: column; gap: 11px; }
.cat-row { display: grid; grid-template-columns: 20px 52px 1fr auto; align-items: center; gap: 8px; }
.cat-row .e { font-size: 15px; }
.cat-row .n { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.cat-row .track { height: 7px; border-radius: 99px; background: var(--card-soft); overflow: hidden; }
.cat-row .fill { display: block; height: 100%; border-radius: 99px; transition: width .5s ease; min-width: 2px; }
.cat-row .v { font-family: var(--num); font-size: 12.5px; color: var(--ink-2); text-align: right; }
.cat-row .v small { color: var(--ink-3); font-family: var(--font); font-size: 10.5px; }

.bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding: 6px 2px 0; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar-col .b {
  width: 100%; max-width: 34px; border-radius: 9px 9px 4px 4px;
  background: linear-gradient(to top, var(--accent), color-mix(in srgb, var(--accent-2) 70%, white));
  min-height: 3px; transition: height .5s cubic-bezier(.2, .8, .2, 1);
  position: relative;
}
html[data-theme="dark"] .bar-col .b {
  background: linear-gradient(to top, #0f766e, #2dd4bf);
}
.bar-col .b.now { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px; }
.bar-col .l { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.bar-col .v { font-size: 10px; color: var(--ink-3); font-family: var(--num); }

/* 日历热力 */
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.heat .wd { font-size: 10px; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.heat .cell {
  aspect-ratio: 1 / 1; border-radius: 7px;
  display: grid; place-items: center;
  font-size: 10px; color: var(--ink-3);
  background: var(--card-soft);
}
.heat .cell.l1 { background: color-mix(in srgb, var(--accent) 14%, var(--card-soft)); }
.heat .cell.l2 { background: color-mix(in srgb, var(--accent) 28%, var(--card-soft)); color: #fff; }
.heat .cell.l3 { background: color-mix(in srgb, var(--accent) 48%, var(--card-soft)); color: #fff; }
.heat .cell.l4 { background: color-mix(in srgb, var(--accent) 72%, var(--card-soft)); color: #fff; }
.heat .cell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }

.merchant-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; }
.merchant-row .rk {
  width: 20px; height: 20px; border-radius: 6px; background: var(--card-soft);
  display: grid; place-items: center; font-size: 10.5px; color: var(--ink-3); font-weight: 700; flex: none;
}
.merchant-row .nm { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.merchant-row .vv { font-family: var(--num); font-size: 13px; }

/* ---------------- 明细筛选 ---------------- */
.month-nav {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 4px 2px 12px;
}
.month-nav .cur { font-weight: 700; font-size: 17px; letter-spacing: -.2px; }
.month-nav .cur small { font-weight: 500; font-size: 11px; color: var(--ink-3); margin-left: 6px; }
.mnav {
  width: 32px; height: 32px; border-radius: 10px; background: var(--card);
  box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink-2);
}
.mnav:disabled { opacity: .35; }

.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: 14px; padding: 9px 12px;
  box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--line) 50%, transparent);
}
.search input { border: 0; outline: 0; background: none; flex: 1; font-size: 14px; min-width: 0; }
.search svg { width: 17px; height: 17px; color: var(--ink-3); flex: none; }

.chips-scroll {
  display: flex; gap: 7px; overflow-x: auto; padding: 10px 2px 6px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.chips-scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font-size: 12px; padding: 6px 11px; border-radius: 99px;
  background: var(--card); color: var(--ink-2);
  border: 1px solid var(--line); white-space: nowrap;
  transition: all .15s;
}
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.chip.dark { background: var(--ink); color: var(--card); border-color: var(--ink); }
html[data-theme="dark"] .chip.dark { background: var(--accent); color: #06201c; border-color: var(--accent); }

/* ---------------- 底部导航 ---------------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--card) 82%, transparent);
  backdrop-filter: blur(16px) saturate(160%);
  border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  box-shadow: var(--shadow-up);
}
.tabbar .inner {
  max-width: 560px; margin: 0 auto;
  height: var(--nav-h); display: grid; grid-template-columns: repeat(4, 1fr);
  align-items: center;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-3); font-size: 10.5px; font-weight: 600;
  transition: color .15s;
}
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }
.tab:active { transform: scale(.96); }

/* 悬浮记账按钮 */
.fab {
  position: fixed; right: max(18px, calc(50% - 280px + 16px));
  bottom: calc(var(--nav-h) + var(--safe-b) + 26px);
  width: 54px; height: 54px; border-radius: 19px;
  background: linear-gradient(145deg, var(--accent-2), var(--accent));
  color: #fff; display: grid; place-items: center;
  box-shadow: 0 12px 26px -10px rgba(15, 118, 110, .8), 0 2px 0 rgba(255,255,255,.15) inset;
  z-index: 41; transition: transform .15s;
}
.fab:active { transform: scale(.92); }
.fab svg { width: 26px; height: 26px; }

/* ---------------- 记账面板 ---------------- */
.mask {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(8, 16, 14, .42);
  opacity: 0; pointer-events: none;
  transition: opacity .22s;
  backdrop-filter: blur(2px);
}
.mask.on { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
  max-width: 560px; margin: 0 auto;
  background: var(--card);
  border-radius: 26px 26px 0 0;
  padding: 8px 18px calc(18px + var(--safe-b));
  box-shadow: 0 -20px 50px -20px rgba(0, 0, 0, .4);
  transform: translateY(103%);
  transition: transform .28s cubic-bezier(.2, .9, .25, 1);
  max-height: 92dvh; overflow-y: auto;
}
.sheet.on { transform: translateY(0); }
.grabber { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 2px auto 12px; }

.amount-row { display: flex; align-items: baseline; gap: 6px; padding: 4px 2px 12px; }
.amount-row .cur { font-size: 24px; font-weight: 600; color: var(--ink-3); }
.amount-row input {
  border: 0; outline: 0; background: none; flex: 1; min-width: 0;
  font-family: var(--num); font-size: 36px; font-weight: 700; letter-spacing: -1.1px;
  color: var(--ink);
}
.amount-row input::placeholder { color: color-mix(in srgb, var(--ink-3) 45%, transparent); }

.cat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.cat-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 1px 6px; border-radius: 13px; border: 1.5px solid transparent;

.field { margin-top: 11px; }

.input {

.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

}

.seg { display: flex; background: var(--card-soft); border-radius: 10px; padding: 3px; gap: 2px; }

.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.btn {

.btn.danger { background: #fee2e2; color: #b91c1c; }

.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

.set-group { margin-bottom: 10px; }

.toast {

  /**
   * 给一条消费猜分类。
   * @param {{merchant?:string, note?:string, cat?:string, kind?:string, amountFen?:number}} tx
   * @param {Object} learned  { 归一化商户: 分类id }
   * @returns {{cat:string, conf:number, reason:string, sub:boolean, transfer?:boolean}}
   */
  function classify(tx, learned) {
    var merchant = String(tx.merchant || '');
    var note = String(tx.note || '');
    var nm = normalizeMerchant(merchant);
    var text = norm(merchant + ' ' + note + ' ' + (tx.cat || ''));
    var sub = SUB_WORDS.some(function (w) { return text.indexOf(norm(w)) >= 0; });

    if (learned && nm && learned[nm] && CUR_BY_ID[learned[nm]]) {
      return { cat: learned[nm], conf: 0.98, reason: '你之前把「' + merchant + '」归到这里', sub: sub };
    }

    // 账单明确标为"转账/红包"的，钱没真正花出去，不计消费
    if (tx.transferish) return { cat: 'social', conf: 0.9, reason: '转账/红包类', sub: false, transfer: true };
    if (/转账|红包/.test(norm(note))) return { cat: 'social', conf: 0.85, reason: '备注里写了转账/红包', sub: false, transfer: true };

    var scores = {};
    var best = {};
    function add(id, score, why) {
      scores[id] = (scores[id] || 0) + score;
      if (!(id in best) || score > best[id].score) best[id] = { score: score, why: why };
    }

    // 账单自带的交易分类
    var hintKey = norm(tx.cat || '');
    Object.keys(HINTS).forEach(function (k) {
      if (hintKey && hintKey.indexOf(norm(k)) >= 0) add(HINTS[k], 4.0, '账单分类：' + k);
    });

    // 学习/健康/交通等强特征
    RULE_HINTS.forEach(function (r) {
      r[1].forEach(function (k) {
        if (text.indexOf(norm(k)) >= 0) add(r[0], r[2], '关键词：' + k);
      });
    });

    if (/(红包|转账|人情|请客|份子)/.test(text)) add('social', 3.2, '红包/转账类');

    // 商户关键词表（跟随用户自定义分类）
    CUR_CATS.forEach(function (c) {
      (c.keywords || []).forEach(function (k) {
        var kk = norm(k);
        if (kk && text.indexOf(kk) >= 0) {
          // 用户自己写的关键词，优先级高于内置规则（否则"王者荣耀"会被"游戏"抢走）
          var w = keywordWeight(kk) + (c.custom ? 1.2 : 0);
          add(c.id, w, '关键词：' + k);
        }
      });
    });

    var winner = null, winScore = 0, second = 0;
    Object.keys(scores).forEach(function (id) {
      if (id === 'other') return;
      if (scores[id] > winScore) { second = winScore; winScore = scores[id]; winner = id; }
      else if (scores[id] > second) second = scores[id];
    });

    if (!winner || winScore < 1.2) {
      return { cat: 'other', conf: 0.3, reason: '没认出来，先放「其他」', sub: sub };
    }
    var conf = Math.min(0.96, 0.42 + winScore * 0.11);
    if (winScore - second < 0.8) conf = Math.min(conf, 0.55);
    return { cat: winner, conf: Math.round(conf * 100) / 100, reason: best[winner].why, sub: sub };
  }

  /** 极简 CSV 解析：支持引号包裹、字段内换行、双引号转义 */
  function parseCSV(text) {
    var rows = [], field = '', row = [], inQ = false;
    var s = String(text || '').replace(/^\uFEFF/, '');
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (inQ) {
        if (ch === '"') {
          if (s[i + 1] === '"') { field += '"'; i++; }
          else inQ = false;
        } else field += ch;
      } else if (ch === '"') {
        inQ = true;
      } else if (ch === ',') {
        row.push(field); field = '';
      } else if (ch === '\n') {
        row.push(field); field = '';
        rows.push(row); row = [];
      } else if (ch === '\r') {
        // 忽略，等 \n
      } else {
        field += ch;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    // 去掉完全空行
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  }

  function detectColumn(header, key) {
    var names = HEADER_MAP[key] || [key];
    for (var i = 0; i < header.length; i++) {
      var h = norm(header[i]).replace(/\s/g, '');
      for (var j = 0; j < names.length; j++) {
        var n = norm(names[j]).replace(/\s/g, '');
        if (h === n) return i;
      }
    }
    // 退一步：包含
    for (var k = 0; k < header.length; k++) {
      var hh = norm(header[k]).replace(/\s/g, '');
      for (var q = 0; q < names.length; q++) {
        if (hh.indexOf(norm(names[q])) >= 0 && hh.length <= norm(names[q]).length + 6) return k;
      }
    }
    return -1;
  }

  function detectHeaderRow(rows) {
    for (var i = 0; i < Math.min(rows.length, 40); i++) {
      var r = rows[i];

      if (a >= 0 && t >= 0) return i;

  function parseAmount(raw) {
    var s = String(raw == null ? '' : raw)
      .replace(/\u00A5|￥|¥|元|人民币|CNY/gi, '')
      .replace(/[,\s]/g, '')
      .replace(/[（(]/g, '-')
      .trim();
    if (!s) return null;
    var m = /-?\d+(?:\.\d+)?/.exec(s);
    if (!m) return null;
    var v = Number(m[0]);
    if (!isFinite(v)) return null;
    return Math.round(Math.abs(v) * 100);
  }

  function parseTime(raw) {
    var s = String(raw == null ? '' : raw).trim();
    var m = /(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/.exec(s);
    if (m) {
      var d = new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
      return isNaN(d.getTime()) ? null : d.getTime();
    }
    // 20261116 / 20261116123305
    m = /^(\d{4})(\d{2})(\d{2})(\d{2})?(\d{2})?(\d{2})?$/.exec(s);
    if (m) {
      var d2 = new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
      return isNaN(d2.getTime()) ? null : d2.getTime();
    }
    return null;
  }

  /* ---------------- xlsx 解析（微信新版「用于个人对账」只给 xlsx） ----------------
   * xlsx 本质是 ZIP + XML，这里手写最小实现：
   *   1. 读 ZIP 中央目录，按名字取条目
   *   2. deflate-raw 用浏览器内置 DecompressionStream 解压（无需第三方库、不联网）
   *   3. 解析 sharedStrings.xml 与 sheet1.xml，转成二维字符串数组
   * 之后交给 parseBillRows，与 CSV 走同一套分类逻辑。
   */
  function parseExcelDate(v) {
    var s = String(v == null ? '' : v).trim();
    if (!/^\d+(\.\d+)?$/.test(s)) return null;
    var n = Number(s);
    if (!(n > 20000 && n < 80000)) return null;
    var d = new Date(Math.round((n - 25569) * 86400000));
    if (isNaN(d.getTime())) return null;
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()) + ' ' +
      pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()) + ':' + pad2(d.getUTCSeconds());
  }

  function xmlText(s) {
    return String(s == null ? '' : s)
      .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
      .replace(/&#x([0-9a-fA-F]+);/g, function (_, h) { return String.fromCodePoint(parseInt(h, 16)); })
      .replace(/&#(\d+);/g, function (_, d) { return String.fromCodePoint(parseInt(d, 10)); })
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  }

  function unzipIndex(buf) {
    var u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    var eocd = -1;
    var min = Math.max(0, u8.length - 66000);
    for (var i = u8.length - 22; i >= min; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }

    return C.getCategory(id);
  }

  function allCats(includeHidden) {
    var list = C.getCategories();
    if (!includeHidden) list = list.filter(function (c) { return !c.hidden; });
    return list;

  /**
   * 用户配置的分类表 + 默认分类的元数据（color/keywords）合并后写回 core。
   * 每次启动、每次改分类都要调用一次。
   */
  function applyCategories() {
    var defaults = {};
    C.CATEGORIES.forEach(function (c) { defaults[c.id] = c; });
    var merged = (state.settings.categories || []).map(function (c) {
      var d = defaults[c.id] || {};
      return {
        id: c.id,
        name: c.name || d.name || c.id,
        emoji: c.emoji || d.emoji || '🏷️',
        color: c.color || d.color || '#94a3b8',
        nature: 'expense',
        keywords: c.keywords || d.keywords || [],
        custom: !!c.custom || !d.id,
        hidden: !!c.hidden
      };
    });
    // 兜底：至少要有"其他"
    if (!merged.length) {
      merged = C.CATEGORIES.map(function (c) {
        return { id: c.id, name: c.name, emoji: c.emoji, color: c.color, keywords: c.keywords, hidden: false };
      });
    }
    if (!merged.some(function (c) { return c.id === 'other'; })) {
      var o = defaults.other || { id: 'other', name: '其他', emoji: '📦', color: '#94a3b8', keywords: [] };
      merged.push({ id: 'other', name: o.name, emoji: o.emoji, color: o.color, keywords: o.keywords, hidden: false });
    }
    state.settings.categories = merged.map(function (c) {
      return {
        id: c.id, name: c.name, emoji: c.emoji, color: c.color,
        hidden: c.hidden, custom: !!c.custom, keywords: c.custom ? c.keywords : undefined
      };
    });
    C.setCategories(state.settings.categories);
    homeSig = '';
  }

  function esc2(v) { return esc(v); }

  /* =========================================================
   * 存储
   * ========================================================= */
  function defaultSettings() {
    return {
      budget: 1500 * 100,
      theme: 'auto',
      privacy: false,
      categories: C.CATEGORIES.map(function (c) {
        return { id: c.id, name: c.name, emoji: c.emoji, color: c.color, hidden: false };
      })
    };
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (!raw) { state.settings = defaultSettings(); return; }
    try {
      var d = JSON.parse(raw);
      state.tx = Array.isArray(d.tx) ? d.tx : [];
      state.settings = Object.assign(defaultSettings(), d.settings || {});
      state.learned = d.learned || {};
      state.imports = d.imports || [];
      // 兼容旧版分类
      var have = {};
      state.settings.categories.forEach(function (c) { have[c.id] = true; });
      C.CATEGORIES.forEach(function (c) {
        if (!have[c.id]) state.settings.categories.push({ id: c.id, name: c.name, emoji: c.emoji, color: c.color, hidden: false });
      });
    } catch (e) {
      console.error('读取本地数据失败', e);
      state.settings = defaultSettings();
    }
  }

  /**
   * 存储可用性探测：有些打开方式（安卓上某些文件管理器 / 无痕模式）
   * 会禁用 localStorage，必须提前告诉用户，而不是记完才发现丢了。
   */
  var storageOK = true;
  function probeStorage() {
    try {
      var k = STORAGE_KEY + '.probe';
      localStorage.setItem(k, '1');
      var v = localStorage.getItem(k);
      localStorage.removeItem(k);
      storageOK = (v === '1');
    } catch (e) {
      storageOK = false;
    }
    var bar = document.getElementById('storageWarn');
    if (bar) bar.classList.toggle('hide', storageOK);
    return storageOK;
  }

  /**
   * 托管到 https（GitHub Pages 等）时启用 PWA：
   *  - 注入 manifest → Chrome 菜单出现「安装应用」，装完是独立窗口
   *  - 注册 Service Worker → 断网也能打开
   * 本地 file:// 打开时什么都不做，避免报错。
   */
  function setupPWA() {
    if (!/^https?:$/.test(String(location.protocol || ''))) return;
    try {
      if (!$('link[rel="manifest"]')) {
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = 'manifest.webmanifest';
        document.head.appendChild(l);
      }
      if (!$('link[rel="apple-touch-icon"]')) {
        var a = document.createElement('link');
        a.rel = 'apple-touch-icon';
        a.href = 'icons/apple-touch-icon.png';
        document.head.appendChild(a);
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () { });
      }
    } catch (e) { }
  }

  function applyTheme() {

    var dark = t === 'dark' || (t === 'auto' && matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0c1210' : '#0f766e');
  }

    document.body.classList.toggle('privacy', !!state.settings.privacy || state.hidden);

  /* =========================================================
   * 提示
   * ========================================================= */
  var toastTimer = 0;
  function toast(msg, action, onAction, ms) {
    var el = $('#toast'), txt = $('#toastText'), btn = $('#toastAction');
    txt.textContent = msg;
    clearTimeout(toastTimer);
    if (action) {
      btn.textContent = action;
      btn.classList.remove('hide');
      btn.onclick = function () {
        clearTimeout(toastTimer);
        el.classList.remove('on');
        btn.classList.add('hide');
        btn.onclick = null;
        try { onAction && onAction(); } catch (e) { console.error(e); }
      };
      // 每次弹新提示都重新计时，避免"撤销"来不及点
      toastTimer = setTimeout(function () {
        el.classList.remove('on');
        btn.classList.add('hide');
        btn.onclick = null;
      }, ms || 6000);
    } else {
      btn.classList.add('hide');
      btn.onclick = null;
      toastTimer = setTimeout(function () { el.classList.remove('on'); }, ms || 2400);
    }
    el.classList.add('on');
  }

  /* =========================================================
   * 首页
   * ========================================================= */
  function renderHome() {
    var mk = state.view.month;
    var sig = mk + '|' + state.rev + '|' + state.settings.budget + '|' + (state.settings.privacy ? 1 : 0);
    if (sig === homeSig && $('#page-home').childNodes.length) return;
    homeSig = sig;
    var st = C.monthStats(state.tx, mk);
    var prevMk = C.shiftMonth(mk, -1);
    var prev = C.monthStats(state.tx, prevMk);
    var budget = state.settings.budget || 0;
    var now = todayDate();
    var isCur = mk === nowMonth();
    var dayN = isCur ? now.getDate() : new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)), 0).getDate();
    var avgDay = st.total / Math.max(1, st.days);
    var proj = isCur ? (st.total / Math.max(1, dayN)) * new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() : st.total;
    var pct = budget > 0 ? st.total / budget : 0;
    var remain = budget - st.total;
    var dayLeft = isCur ? new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate() + 1 : 0;
    var dailyAllow = remain > 0 && dayLeft > 0 ? remain / dayLeft : 0;

    var diffTxt = '';
    if (prev.total > 0) {
      var d = (st.total - prev.total) / prev.total * 100;
      diffTxt = (d >= 0 ? '比上月多 ' : '比上月省 ') + Math.abs(d).toFixed(0) + '%';
    } else if (st.total > 0) {
      diffTxt = '上月还没有记录';
    }

    var ringPct = Math.max(0, Math.min(100, pct * 100));
    var ringColor = pct >= 1 ? '#fb7185' : pct >= 0.8 ? '#fbbf24' : '#5eead4';
    var dash = 2 * Math.PI * 40;
    var dashOff = dash * (1 - Math.min(1, pct));

    var catRank = C.catRank(st);
    var quick = topCats();

    var html = '';
    html += '<section class="hero">';
    html += '<div class="between" style="position:relative;z-index:2">';
    html += '<span class="month">' + C.monthLabel(mk).replace('年', ' · ') + '</span>';
    html += '<div class="row" style="gap:4px">';
    html += '<button class="hmonth" data-month="-1" aria-label="上个月">‹</button>';
    html += '<button class="hmonth" data-month="1"' + (mk >= nowMonth() ? ' disabled' : '') + ' aria-label="下个月">›</button>';
    html += '</div></div>';
    html += '<div class="label">本月共花了</div>';
    html += '<div class="amount"><span class="cur">¥</span><span class="num" data-amount="' + st.total + '">' + C.moneyInt(st.total) + '</span><span class="dec">' + padDec(st.total) + '</span></div>';
    html += '<div class="sub">';
    html += '<span>' + st.count + ' 笔</span>';
    if (st.days) html += '<span>日均 <b>' + fen(Math.round(avgDay / 100) * 100) + '</b></span>';
    if (diffTxt) html += '<span>' + diffTxt + '</span>';
    html += '</div>';

    html += '<div class="budget-line">';
    if (budget > 0) {
      html += '<div class="txt"><span>预算 ' + noMoney(budget) + '</span><span>' + (remain >= 0 ? '还剩 <b>' + noMoney(remain) + '</b>' : '超支 <b>' + noMoney(-remain) + '</b>') + '</span></div>';
      html += '<div class="bar' + (pct > 1 ? ' over' : '') + '"><i style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></i></div>';
      html += '<div class="txt"><span>已用 ' + (pct * 100).toFixed(0) + '%</span>';
      if (isCur && dailyAllow > 0) html += '<span>' + dayLeft + ' 天 · 每天 <b>' + noMoney(dailyAllow) + '</b></span>';
      else if (pct > 1) html += '<span>这月超了一点，下月收着点</span>';
      html += '</div>';
    } else {
      html += '<div class="txt"><span>还没设预算</span><a href="#settings" data-go="settings" style="color:#5eead4">去设置 →</a></div>';
    }
    html += '</div>';

    html += '</section>';

    // 快捷记一笔
    html += '<div class="section-t">快捷记一笔 <span class="count">点一下就开始</span></div>';
    html += '<div class="quick-scroll"><div class="quick-grid">';
    quick.forEach(function (c, qi) {
      html += '<button class="quick" data-quick="' + c.id + '">';
      html += '<span class="e">' + c.emoji + '</span><span class="n">' + esc(c.name) + '</span>';
      html += '<span class="c">' + (monthCatFen(mk, c.id) > 0 ? noMoney(monthCatFen(mk, c.id)) : '—') + '</span>';
      html += '</button>';
    });
    html += '</div></div>';

    // 本月发现
    var insights = buildInsights(st, prev, budget, proj, isCur, dayN);
    if (insights.length) {
      html += '<div class="section-t">本月发现 <span class="count">' + insights.length + ' 条</span></div>';
      html += '<div class="card pad" style="padding-top:6px;padding-bottom:6px">';
      insights.slice(0, 3).forEach(function (it) {
        html += '<div class="row" style="align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)">';

        html += '<div class="tiny muted" style="margin-top:1px">' + it.desc + '</div></div></div>';
      });
      html += '</div>';
    }

    var recent = state.tx.filter(function (t) { return !t.deletedAt; })
      .sort(function (a, b) { return b.ts - a.ts; }).slice(0, 6);

    } else {

      recent.forEach(function (t) { html += txRow(t, true); });
      html += '</div>';
    }

    html += '<div class="tiny muted" style="text-align:center;margin-top:22px;line-height:1.9">';
    html += '数据只保存在这台设备的浏览器里 · 记得偶尔导出备份<br>';
    html += '<span style="opacity:.7">月记 v1.1</span></div>';

    $('#page-home').innerHTML = html;
  }

  function padDec(fenVal) {
    var d = Math.abs(Math.round(fenVal)) % 100;
    return '.' + C.pad2(d);
  }

  function monthCatFen(mk, catId) {
    var st = C.monthStats(state.tx, mk);
    return st.byCat[catId] ? st.byCat[catId].fen : 0;
  }

  function topCats() {
    var counts = {};
    state.tx.forEach(function (t) { if (!t.deletedAt) counts[t.cat] = (counts[t.cat] || 0) + 1; });
    var list = allCats();
    return list.map(function (c) { return c; })
      .sort(function (a, b) { return (counts[b.id] || 0) - (counts[a.id] || 0); })
      .slice(0, 8);
  }

  function buildInsights(st, prev, budget, proj, isCur, dayN) {
    var arr = [];
    if (st.count && budget > 0 && isCur) {
      var p = st.total / budget;
      if (p >= 1) {
        arr.push({ icon: '🔥', title: '本月已经超预算了', desc: '超出 ' + noMoney(st.total - budget) + '，接下来尽量只花饭钱。' });
      } else if (p >= 0.8) {
        arr.push({ icon: '⚠️', title: '预算用了 ' + Math.round(p * 100) + '%', desc: '按现在的速度，月底大概会花 ' + noMoney(proj) + '。' });
      }
    }
    var rank = C.catRank(st);
    if (rank.length && rank[0].share >= 0.3) {
      arr.push({ icon: rank[0].emoji, title: rank[0].name + '占了 ' + Math.round(rank[0].share * 100) + '%', desc: '这个月 ' + noMoney(rank[0].fen) + ' 花在' + rank[0].name + '上，共 ' + rank[0].count + ' 笔。' });
    }
    if (st.max && st.max.amountFen >= 10000) {
      arr.push({ icon: '💸', title: '最大一笔 ' + noMoney(st.max.amountFen), desc: st.max.merchant + (st.max.note ? '（' + st.max.note + '）' : '') });
    }
    var subs = C.findSubscriptions(state.tx).filter(function (s) { return s.hit; });
    if (subs.length) {
      var sum = subs.reduce(function (s, x) {
        var ms = Object.keys(x.months);
        return s + (x.months[ms[0]] || 0);
      }, 0);
      arr.push({ icon: '🔁', title: subs.length + ' 个自动续费', desc: '像是会员/订阅，每个月大概 ' + noMoney(sum) + '，不用了记得去关。' });
    }
    if (prev.total > 0 && st.total > 0) {
      var d = (st.total - prev.total) / prev.total;
      if (d <= -0.15) arr.push({ icon: '👏', title: '比上月省了 ' + Math.abs(d * 100).toFixed(0) + '%', desc: '上个月 ' + noMoney(prev.total) + '，这个月 ' + noMoney(st.total) + '。' });
    }
    if (st.unknown > 0) {
      arr.push({ icon: '🏷️', title: noMoney(st.unknown) + ' 还没分类好', desc: '在明细里点开这些记录，改一次分类，下次就会记住。' });
    }
    return arr;
  }

  function txRow(t, compact) {
    var c = catOf(t.cat);
    var isIn = t.dir === 'in' || t.dir === 'refund';
    var tags = '';
    if (t.dir === 'refund') tags += '<span class="tag gray">退款</span>';
    if (t.sub) tags += '<span class="tag">订阅</span>';
    if (t.conf != null && t.conf < 0.5 && t.cat === 'other' && !isIn) tags += '<span class="tag warn">待分类</span>';
    var sub = [];
    if (!compact) sub.push(timeStr(t.ts));
    sub.push(c.emoji + ' ' + c.name);
    if (t.method) sub.push(t.method);
    var name = t.merchant || (t.note || '未注明');
    var noteTxt = t.note && t.note !== t.merchant ? t.note : '';
    var html = '<button class="tx" data-tx="' + t.id + '">';
    html += '<span class="ico">' + c.emoji + '</span>';
    html += '<span class="mid"><span class="name">' + esc(name) + (noteTxt ? ' <span class="tiny muted" style="font-weight:400">· ' + esc(noteTxt) + '</span>' : '') + '</span>';
    html += '<span class="meta">' + sub.map(esc).join('<span class="dot">·</span>') + (tags ? ' ' + tags : '') + '</span></span>';
    html += '<span class="amt ' + (isIn ? 'in' : 'out') + '">' + (isIn ? '+' : '') + noMoney(t.amountFen) + '</span>';
    html += '</button>';
    return html;
  }

        html += '<div class="card tx-card">';
        items.forEach(function (t) { html += txRow(t, false); });

      html += '<div class="tiny muted" style="text-align:center;padding:8px 0 18px">共 ' + list.length + ' 笔</div>';

    var qi = $('#q');

        var nq = $('#q');
        if (nq) { nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); }

  function debounce(fn, ms) {
    var t = 0;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);
    };
  }

  /* =========================================================
   * 统计
   * ========================================================= */
  function renderStats() {
    var mk = state.view.month;
    var st = C.monthStats(state.tx, mk);

    var budget = state.settings.budget || 0;

    var html = '';
    var canNext = C.shiftMonth(mk, 1) <= nowMonth();
    html += '<div class="month-nav">';
    html += '<button class="mnav" data-mv="-1" aria-label="上个月"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>';
    html += '<div class="cur">' + C.monthLabel(mk) + '<small>支出 ' + fen(st.total) + '</small></div>';
    html += '<button class="mnav" data-mv="1"' + (canNext ? '' : ' disabled') + ' aria-label="下个月"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>';
    html += '</div>';

    if (!rank.length) {
      html += '<div class="card empty"><div class="big">📊</div><div>这个月还没有支出</div><div class="small" style="margin-top:4px">先记几笔，这里就会有分类占比和趋势</div></div>';
    } else {
      // 环形图
      var top = rank.slice(0, 5);
      var rest = rank.slice(5);
      var stops = [];
      var acc = 0;
      top.forEach(function (c) {
        var from = acc;
        acc += c.share * 100;
        stops.push(c.color + ' ' + from.toFixed(2) + '% ' + Math.max(from, acc - 0.6).toFixed(2) + '%');
      });
      if (rest.length || acc < 100) {
        var restShare = 100 - acc;
        if (restShare > 0.2) stops.push('#cbd5d1 ' + acc.toFixed(2) + '% 100%');
      }
      var conic = stops.length ? 'conic-gradient(' + stops.join(',') + ')' : 'conic-gradient(#e2e8e4 0 100%)';

      html += '<div class="card pad" style="padding:18px">';
      html += '<div class="donut-wrap">';
      html += '<div style="position:relative;flex:none">';
      html += '<div style="width:128px;height:128px;border-radius:50%;background:' + conic + ';-webkit-mask:radial-gradient(circle 42px at center,transparent 98%,#000 100%);mask:radial-gradient(circle 42px at center,transparent 98%,#000 100%)"></div>';
      html += '<div class="donut-center"><span class="k">总支出</span><span class="v">' + noMoney(st.total) + '</span><span class="k">' + st.count + ' 笔</span></div>';
      html += '</div>';
      html += '<div style="flex:1;min-width:0">';
      top.slice(0, 3).forEach(function (c) {
        html += '<div class="row" style="gap:8px;padding:3px 0"><span style="width:9px;height:9px;border-radius:3px;background:' + c.color + ';flex:none"></span>';
        html += '<span style="font-size:13px;flex:1">' + c.emoji + ' ' + esc(c.name) + '</span><span class="num" style="font-size:12.5px">' + Math.round(c.share * 100) + '%</span></div>';
      });
      if (budget > 0) {
        var p = st.total / budget;
        html += '<div class="tiny" style="margin-top:8px;color:' + (p > 1 ? 'var(--danger)' : 'var(--ink-3)') + '">预算 ' + noMoney(budget) + ' · ' + (p > 1 ? '超 ' + noMoney(st.total - budget) : '剩 ' + noMoney(budget - st.total)) + '</div>';
      }
      html += '</div></div></div>';

      // 分类明细
      html += '<div class="section-t">分类占比</div><div class="card pad"><div class="cat-list">';
      rank.forEach(function (c) {
        html += '<div class="cat-row"><span class="e">' + c.emoji + '</span><span class="n">' + esc(c.name) + '</span>';
        html += '<span class="track"><i class="fill" style="width:' + (c.share * 100).toFixed(1) + '%;background:' + c.color + '"></i></span>';
        html += '<span class="v">' + noMoney(c.fen) + ' <small>' + Math.round(c.share * 100) + '%</small></span></div>';
      });
      html += '</div></div>';

      // 6 个月趋势
      var ms = C.monthSeries(state.tx, mk, 6);
      var maxFen = Math.max.apply(null, ms.map(function (x) { return x.fen; }).concat([1]));
      html += '<div class="section-t">近 6 个月</div><div class="card pad"><div class="bars">';
      ms.forEach(function (x) {
        var h = maxFen > 0 ? Math.max(3, (x.fen / maxFen) * 92) : 3;
        html += '<div class="bar-col"><span class="v">' + (x.fen ? (x.fen / 100).toFixed(0) : '') + '</span>';
        html += '<div class="b' + (x.mk === nowMonth() ? ' now' : '') + '" style="height:' + h.toFixed(1) + 'px"></div>';
        html += '<span class="l">' + (Number(x.mk.slice(5, 7)) + '月') + '</span></div>';
      });
      html += '</div>';
      var sum6 = ms.reduce(function (s, x) { return s + x.fen; }, 0);
      html += '<div class="tiny muted" style="text-align:center;margin-top:10px">6 个月合计 ' + fen(sum6) + '，月均 ' + fen(Math.round(sum6 / 6)) + '</div>';

      // 日历
      html += '<div class="section-t">每天花多少 <span class="count">颜色越深越贵</span></div>';
      html += '<div class="card pad">' + calendar(mk, st) + '</div>';

      // 商户榜
      var mr = C.merchantRank(st, 6);
      if (mr.length) {
        html += '<div class="section-t">花钱最多的地方</div><div class="card pad" style="padding-top:6px;padding-bottom:8px">';
        mr.forEach(function (m, i) {
          html += '<div class="merchant-row"><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(m.name) + ' <span class="tiny muted">' + m.count + '笔</span></span><span class="vv">' + noMoney(m.fen) + '</span></div>';

        html += '<div class="section-t">可能是自动续费</div><div class="card pad" style="padding-top:6px;padding-bottom:8px">';

        });
        html += '<div class="tiny muted" style="padding:6px 2px">这些不是问题，但记得检查不用的会员，别让它一直扣。</div>';
        html += '</div>';
      }
    }

    $('#page-stats').innerHTML = html;
  }

  function calendar(mk, st) {
    var daily = C.dailySeries(state.tx, mk);
    var d0 = C.parseDayKey(mk + '-01');
    var firstWd = (d0.getDay() + 6) % 7; // 周一为 0
    var max = Math.max.apply(null, daily.map(function (x) { return x.fen; }).concat([1]));
    var html = '<div class="heat">';
    ['一', '二', '三', '四', '五', '六', '日'].forEach(function (w) { html += '<div class="wd">' + w + '</div>'; });
    for (var i = 0; i < firstWd; i++) html += '<div></div>';
    daily.forEach(function (x) {
      var lv = 0;
      if (x.fen > 0) {
        var r = x.fen / max;
        lv = r > 0.75 ? 4 : r > 0.5 ? 3 : r > 0.25 ? 2 : 1;
      }
      var isToday = x.d === todayKey();
      html += '<div class="cell l' + lv + (isToday ? ' today' : '') + '" title="' + x.d + ' ' + fen(x.fen) + '">' + x.day + '</div>';
    });
    html += '</div>';
    html += '<div class="row tiny muted" style="justify-content:flex-end;margin-top:10px;gap:5px">少';
    [0, 1, 2, 3, 4].forEach(function (l) { html += '<span style="width:13px;height:13px;border-radius:4px" class="heat-swatch l' + l + '"></span>'; });
    html += '多</div>';
    return html;
  }

  /* =========================================================

  function renderCurrent() {
    var p = state.view.page;
    $$('.page').forEach(function (el) { el.classList.add('hide'); });
    $('#page-' + p).classList.remove('hide');
    $$('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.page === p); });
    document.body.classList.toggle('on-settings', p === 'settings');
    if (p === 'home') renderHome();
    else if (p === 'ledger') renderLedger();
    else if (p === 'stats') renderStats();
    else if (p === 'settings') renderSettings();
    applyPrivacy();
  }

  };

    var amount = C.yuanToFen($('#fAmount').value || '0');

    if (!merchant) { hint.textContent = ''; return; }
    var g = C.classify({ merchant: merchant, note: '', dir: form.dir }, state.learned);
    if (g.cat && g.cat !== form.cat) {
      var c = catOf(g.cat);
      hint.innerHTML = '看起来像 <b>' + c.emoji + ' ' + esc(c.name) + '</b> · <a href="#" data-applycat="' + g.cat + '">用这个</a>';
    } else {
      hint.textContent = '';
    }

  function saveTx() {
    var amountFen = C.yuanToFen($('#fAmount').value || '');
    var merchant = $('#fMerchant').value.trim();
    if (!amountFen) { toast('先填一个金额'); $('#fAmount').focus(); return; }
    if (amountFen > 100000000) { toast('金额太大了，检查一下'); return; }

    var ts = form.when === 'now' ? Date.now()
      : form.when === 'yesterday' ? (function () {
          var d = new Date(); d.setDate(d.getDate() - 1); return d.getTime();
        })()
        : (function () {
            var v = $('#fWhen').value;
            if (!v) return Date.now();
            var t = new Date(v).getTime();
            return isNaN(t) ? Date.now() : t;
          })();

    if (state.editing) {
      var t = state.editing;
      t.amountFen = amountFen;
      t.merchant = merchant || '未注明';
      t.cat = form.cat;
      t.dir = form.dir === 'in' ? 'in' : 'out';
      t.method = form.pay;
      t.ts = ts;
      t.conf = 1;
      t.updatedAt = Date.now();
      touch();
      toast('已保存');
    } else {
      var item = {
        id: C.uid(),
        ts: ts,
        amountFen: amountFen,
        dir: form.dir === 'in' ? 'in' : 'out',
        cat: form.cat,
        merchant: merchant || '未注明',
        note: '',
        method: form.pay,
        source: 'manual',
        conf: 1,
        createdAt: Date.now()
      };
      state.tx.push(item);
      // 学习：这个商户以后默认这个分类
      var g = C.classify({ merchant: merchant, note: '' }, {});
      if (merchant && g.cat !== form.cat && C.normalizeMerchant(merchant)) {
        state.learned[C.normalizeMerchant(merchant)] = form.cat;
      }
      touch();
      toast('记好了 · ' + fen(amountFen), '撤销', function () {
        var i = state.tx.findIndex(function (x) { return x.id === item.id; });
        if (i >= 0) { state.tx.splice(i, 1); save(true); renderCurrent(); }
      }, 5000);
    }
    closeSheet();
    state.view.ledgerMonth = C.monthKey(ts);
    state.view.month = C.monthKey(ts);
    homeSig = '';
    renderCurrent();
  }

  /** 统一入口：ArrayBuffer + 文件名 → 解析 → 渲染预览 */
  function loadBuffer(buf, name) {
    importState.fileName = name || '';
    if (/\.xlsx$/i.test(name || '')) {
      return C.parseXlsx(buf, { platform: importState.platform }).then(function (p) {
        importState.parsed = p;
        renderPreview();
        return p;
      }, function (err) {
        importState.parsed = {
          ok: false, platform: 'generic', items: [], skipped: [],
          warnings: [err && err.message ? err.message : 'xlsx 解析失败'], header: [], rows: []
        };
        renderPreview();
        return importState.parsed;
      });
    }
    var text = decodeBuffer(buf, 'utf-8');
    if (text.indexOf('\uFFFD') >= 0 && importState.encoding !== 'manual') {
      var gbk = decodeBuffer(buf, 'gbk');
      if (gbk && gbk.indexOf('\uFFFD') < 0) { text = gbk; importState.encoding = 'gbk'; }
    }
    importState.payload = text;
    importState.parsed = C.parseBill(text, { platform: importState.platform });
    renderPreview();
    return Promise.resolve(importState.parsed);
  }

  function readFile(file) {
    if (/\.xls$/i.test(file.name)) {
      toast('旧版 .xls 读不了：请用 Excel/WPS 另存为 .xlsx 或 CSV');
      return;
    }
    importState.fileName = file.name;
    var reader = new FileReader();
    reader.onload = function (e) { loadBuffer(e.target.result, file.name); };
    reader.readAsArrayBuffer(file);
  }

  function decodeBuffer(buf, enc) {
    try {
      if (window.TextDecoder) return new TextDecoder(enc).decode(buf);
    } catch (e) { }
    return new TextDecoder('utf-8').decode(buf);
  }

  function renderPreview() {
    var p = importState.parsed;
    if (!p) return;
    var body = $('#importBody');
    if (!body) return;

    if (!p.ok) {
      var w = p.warnings.join('；') || '没解析出记录';
      body.innerHTML = '<div class="card pad" style="border:1px solid #fecaca;background:#fef2f2"><div style="font-weight:700;color:#b91c1c">解析失败</div>' +
        '<div class="small" style="margin-top:6px;color:#7f1d1d">' + esc(w) + '</div>' +
        '<div class="tiny muted" style="margin-top:8px">常见原因：文件是 Excel（.xlsx）而不是 CSV；或者导出的是 PDF 账单。</div></div>' +
        '<div class="row" style="gap:8px;margin-top:14px"><button class="btn ghost" data-act="import-reset">重新选文件</button>' +
        '<button class="btn" data-act="import-demo">导入示例账单试试</button></div>';
      return;
    }

    // 统计
    var outs = p.items.filter(function (i) { return i.dir === 'out'; });
    var ins = p.items.filter(function (i) { return i.dir === 'in'; });
    var sum = outs.reduce(function (s, i) { return s + i.amountFen; }, 0);
    var cats = {};
    p.items.forEach(function (i) {
      var g = C.classify({ merchant: i.merchant, note: i.note, cat: i.catHint }, state.learned);
      i._cat = g.cat;
    });

    var html = '';
    html += '<div class="card pad" style="padding:14px 16px">';
    html += '<div class="between"><div style="font-weight:700;font-size:14px">' + (p.platform === 'alipay' ? '支付宝' : p.platform === 'wechat' ? '微信支付' : '通用 CSV') + ' 账单</div>';
    html += '<span class="tiny muted">' + esc(importState.fileName) + '</span></div>';
    html += '<div class="stat-line" style="margin-top:8px"><span>支出 <b>' + outs.length + '</b> 笔 / <b>' + fen(sum) + '</b></span><span>收入 <b>' + ins.length + '</b> 笔</span>';
    if (p.skipped.length) html += '<span class="muted">跳过 <b>' + p.skipped.length + '</b> 笔</span>';
    html += '</div>';
    if (p.skipped.length) {
      html += '<details style="margin-top:8px"><summary class="tiny muted" style="cursor:pointer">看看跳过了什么</summary>';
      html += '<div class="tiny muted" style="margin-top:6px;line-height:1.7">';
      p.skipped.slice(0, 8).forEach(function (x) {
        html += '· ' + esc(x.reason) + '：' + esc(String(x.raw || '').slice(0, 44)) + '<br>';
      });
      if (p.skipped.length > 8) html += '· …还有 ' + (p.skipped.length - 8) + ' 条<br>';
      html += '<span style="opacity:.8">转账、红包、提现这类"钱没花掉"的记录会自动跳过；如果某笔确实是消费，手动补记一下就好。</span>';
      html += '</div></details>';
    }
    html += '</div>';

    // 分类分布
    p.items.forEach(function (i) { cats[i._cat] = (cats[i._cat] || 0) + i.amountFen; });
    var catArr = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });
    html += '<div class="chips-scroll" style="padding-top:10px">';
    catArr.forEach(function (id) {
      var c = catOf(id);
      html += '<span class="chip" style="background:var(--card)">' + c.emoji + ' ' + esc(c.name) + ' ' + noMoney(cats[id]) + '</span>';
    });
    html += '</div>';

    // 表格
    html += '<div class="section-t">预览 <span class="count">点分类可以改</span></div>';
    html += '<div class="preview"><div class="preview-scroll"><table class="pt"><thead><tr><th>时间</th><th>商户 / 商品</th><th>分类</th><th style="text-align:right">金额</th></tr></thead><tbody>';
    var rows = p.items.slice(0).sort(function (a, b) { return b.ts - a.ts; });
    var shown = rows.slice(0, 80);
    shown.forEach(function (i, idx) {
      var c = catOf(i._cat);
      html += '<tr>';
      html += '<td class="muted">' + (new Date(i.ts).getMonth() + 1) + '/' + new Date(i.ts).getDate() + ' ' + timeStr(i.ts) + '</td>';
      html += '<td>' + esc(i.merchant) + (i.note && i.note !== i.merchant ? ' <span class="tiny muted">' + esc(i.note) + '</span>' : '') + '</td>';
      html += '<td><select data-pcat="' + idx + '">';
      allCats().forEach(function (x) {
        html += '<option value="' + x.id + '"' + (x.id === i._cat ? ' selected' : '') + '>' + x.emoji + ' ' + esc(x.name) + '</option>';
      });
      html += '</select></td>';
      html += '<td class="amt" style="text-align:right;color:' + (i.dir === 'in' ? '#0d9488' : 'var(--ink)') + '">' + (i.dir === 'in' ? '+' : '') + noMoney(i.amountFen) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
    if (rows.length > shown.length) html += '<div class="tiny muted" style="text-align:center;margin-top:6px">只显示最近 ' + shown.length + ' 条，导入时会全部导入</div>';

    // 重复
    var dups = countDuplicates(p.items);
    if (dups > 0) {
      html += '<div class="card pad small" style="margin-top:12px;background:var(--card-soft)">其中 <b>' + dups + '</b> 条看起来已经导入过，会自动跳过。</div>';
    }

    html += '<div style="margin-top:16px"><button class="btn" data-act="do-import">导入 ' + p.items.length + ' 笔</button></div>';
    html += '<div style="margin-top:8px"><button class="btn ghost" data-act="import-reset">重新选别的文件</button></div>';
    html += '<div style="height:8px"></div>';
    body.innerHTML = html;

    $$('#importBody select[data-pcat]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        var i = shown[Number(sel.dataset.pcat)];
        if (i) i._cat = sel.value;
      });
    });
  }

  function countDuplicates(items) {
    var have = {};
    state.tx.forEach(function (t) { have[t.fp || C.fingerprint(t)] = true; });
    var n = 0;
    items.forEach(function (i) { if (have[C.fingerprint(i)]) n++; });
    return n;
  }

  function doImport() {
    var p = importState.parsed;
    if (!p || !p.ok) return;
    var have = {};
    state.tx.forEach(function (t) { if (t.fp) have[t.fp] = true; });
    var importId = C.uid();
    var added = 0, dup = 0;
    p.items.slice(0).sort(function (a, b) { return a.ts - b.ts; }).forEach(function (i) {
      var fp = C.fingerprint(i);
      if (have[fp]) { dup++; return; }
      have[fp] = true;
      var g = C.classify({ merchant: i.merchant, note: i.note, cat: i.catHint }, state.learned);
      var cat = i._cat || g.cat;
      var isRefund = i.dir === 'in' && /退款/.test((i.note || '') + (i.catHint || ''));
      state.tx.push({
        id: C.uid(), ts: i.ts, amountFen: i.amountFen,
        dir: i.dir, cat: cat,
        merchant: (i.merchant || '').slice(0, 60),
        note: (i.note || '').slice(0, 80),
        method: i.method || (p.platform === 'wechat' ? '微信' : p.platform === 'alipay' ? '支付宝' : ''),
        source: isRefund ? 'refund' : p.platform,
        fp: fp, conf: g.conf, reason: g.reason,
        sub: g.sub, importId: importId, createdAt: Date.now()
      });
      if (cat !== g.cat && i.merchant) {
        var nm = C.normalizeMerchant(i.merchant);
        if (nm) state.learned[nm] = cat;
      }
      added++;
    });
    state.imports.unshift({ id: importId, file: importState.fileName, at: Date.now(), count: added, platform: p.platform });
    state.imports = state.imports.slice(0, 20);
    save(true);
    closeImport();
    var mk = C.monthKey(p.items[p.items.length - 1].ts);
    state.view.month = C.monthKey(Date.now());
    state.view.ledgerMonth = mk;
    go('ledger');
    toast('导入完成：新增 ' + added + ' 笔' + (dup ? '，跳过重复 ' + dup + ' 笔' : ''), null, null, 3800);
  }

  function closeImport() {
    $('#mask').classList.remove('on');
    $('#importSheet').classList.remove('on');
    document.body.style.overflow = '';
  }

  /* =========================================================
   * 导出
   * ========================================================= */
  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 600);
  }

  function monthlyReport() {
    var mk = state.view.month || nowMonth();
    var st = C.monthStats(state.tx, mk);
    var budget = state.settings.budget || 0;
    var rank = C.catRank(st);
    var lines = [];
    lines.push('📒 月记 · ' + C.monthLabel(mk) + ' 开销小结');
    lines.push('');
    lines.push('共花了 ¥' + C.money(st.total, { bare: true }) + '，' + st.count + ' 笔' + (st.days ? '，' + st.days + ' 天有消费' : ''));
    if (st.income > 0) lines.push('这个月进账 ¥' + C.money(st.income, { bare: true }));
    if (budget > 0) {
      var p = st.total / budget;
      lines.push('预算 ¥' + C.money(budget, { bare: true }) + '，' + (p > 1 ? '超了 ¥' + C.money(st.total - budget, { bare: true }) : '还剩 ¥' + C.money(budget - st.total, { bare: true })));
    }
    if (rank.length) {
      lines.push('');
      lines.push('花得最多的三类：');
      rank.slice(0, 3).forEach(function (c, i) {
        lines.push((i + 1) + '. ' + c.emoji + ' ' + c.name + ' ¥' + C.money(c.fen, { bare: true }) + '（' + Math.round(c.share * 100) + '%）');
      });
    }
    var mr = C.merchantRank(st, 3);
    if (mr.length) {
      lines.push('');
      lines.push('常去的地方：' + mr.map(function (m) { return m.name; }).join('、'));
    }
    if (st.max) {
      lines.push('最大一笔：' + st.max.merchant + ' ¥' + C.money(st.max.amountFen, { bare: true }));
    }
    lines.push('');
    lines.push('—— 来自「月记」');
    var text = lines.join('\n');
    showReport(text);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function () { });
      }
    } catch (e) { }
  }

  function showReport(text) {
    var html = '<div class="sheet-head"><span class="t">本月小结</span><button class="del" data-act="close-import" style="color:var(--ink-3)">关闭</button></div>';
    html += '<div class="card pad" style="white-space:pre-wrap;font-size:13.5px;line-height:1.9;background:var(--card-soft)">' + esc(text) + '</div>';
    html += '<div class="tiny muted" style="margin-top:10px;text-align:center">已尝试复制到剪贴板</div>';
    $('#importSheet').innerHTML = html;
    $('#mask').classList.add('on');
    $('#importSheet').classList.add('on');
    document.body.style.overflow = 'hidden';
  }

  function exportCSV() {
    var rows = state.tx.filter(function (t) { return !t.deletedAt; })
      .sort(function (a, b) { return a.ts - b.ts; })
      .map(function (t) {
        var c = catOf(t.cat);
        var d = new Date(t.ts);
        return [
          C.ymd(d), timeStr(t.ts), t.dir === 'in' ? '收入' : '支出', c.name,
          t.merchant || '', t.note || '', (t.amountFen / 100).toFixed(2),
          t.method || '', t.source || '', t.sub ? '是' : ''
        ];
      });
    var csv = C.toCSV(rows, ['日期', '时间', '收支', '分类', '商户', '备注', '金额', '支付方式', '来源', '疑似订阅']);
    var d = new Date();
    download('月记-账单-' + C.ymd(d) + '.csv', csv, 'text/csv;charset=utf-8');
    toast('已导出 CSV，可用 Excel / WPS 打开');
  }

  function exportJSON() {
    var data = { v: 1, exportedAt: new Date().toISOString(), settings: state.settings, learned: state.learned, tx: state.tx };
    var d = new Date();
    download('月记-备份-' + C.ymd(d) + '.json', JSON.stringify(data, null, 1), 'application/json');
    toast('已导出备份');
  }

  function importJSON(file) {
    var r = new FileReader();
    r.onload = function (e) {
      try {
        var d = JSON.parse(e.target.result);
        if (!d || !Array.isArray(d.tx)) throw new Error('格式不对');
        var have = {};
        state.tx.forEach(function (t) { if (t.id) have[t.id] = true; });
        var n = 0;
        d.tx.forEach(function (t) {
          if (!t.id || !t.ts || !t.amountFen) return;
          if (have[t.id]) return;
          have[t.id] = true;
          state.tx.push(t);
          n++;
        });
        if (d.learned) Object.assign(state.learned, d.learned);
        if (d.settings && d.settings.budget) state.settings.budget = d.settings.budget;
        save(true);
        go('home');
        toast('恢复完成：合并 ' + n + ' 笔');
      } catch (err) {
        toast('备份文件读不出来：' + err.message);
      }
    };
    r.readAsText(file, 'UTF-8');
  }

  /* =========================================================
   * 回收站 / 清空
   * ========================================================= */
  function addCategory() {
    var name = window.prompt('新分类叫什么？（例如：宠物、游戏、礼物、房租）', '');
    if (!name || !name.trim()) return;
    var emoji = window.prompt('给它一个 emoji（可留空）', '🏷️');
    emoji = (emoji || '🏷️').trim().slice(0, 4) || '🏷️';
    var c = C.makeCategory(name.trim().slice(0, 10), emoji);
    state.settings.categories.push({
      id: c.id, name: c.name, emoji: c.emoji, color: c.color,
      hidden: false, custom: true, keywords: []
    });
    applyCategories();
    touch();
    renderSettings();
    openCatManager();
    toast('已新建分类「' + c.name + '」');
  }

  /* ---------------- 分类管理面板 ---------------- */
  function catUseCount(id) {
    var n = 0;
    state.tx.forEach(function (t) {
      if (!t.deletedAt && t.cat === id) n++;
    });
    return n;
  }

    html += '<div class="card" style="overflow:hidden">';
    list.forEach(function (c, i) {

      html += '<div class="catmgr">';
      html += '<div class="top">';
      html += '<button class="ic" data-editemoji="' + c.id + '" title="换图标">' + c.emoji + '</button>';
      html += '<button class="nm" data-editcat="' + c.id + '">' + esc(c.name) + (c.hidden ? ' <span class="tag gray">隐藏中</span>' : '') + '</button>';
      html += '<button class="chip' + (c.hidden ? '' : ' on') + '" data-hide="' + c.id + '">' + (c.hidden ? '显示' : '隐藏') + '</button>';
      html += '<button class="mini" data-kwcat="' + c.id + '" title="自动识别关键词">✎</button>';
      html += '<button class="mini danger" data-delcat="' + c.id + '" title="删除">×</button>';
      html += '</div>';

  /**
   * 数据自检：不依赖网络，检查记录结构、分类引用、金额、重复、时间范围。
   * 返回 {ok, checks:[{name, pass, detail}]}
   */
  function integrityCheck() {
    var checks = [];
    var list = state.tx;
    function add(name, pass, detail) { checks.push({ name: name, pass: !!pass, detail: detail || '' }); }

    add('记录条数', list.length >= 0, list.length + ' 条（含已删除 ' + list.filter(function (t) { return t.deletedAt; }).length + ' 条）');

    var bad = list.filter(function (t) {
      return !t.id || typeof t.ts !== 'number' || !isFinite(t.ts) || t.ts <= 0 ||
        typeof t.amountFen !== 'number' || !isFinite(t.amountFen) || t.amountFen <= 0 ||
        ['out', 'in'].indexOf(t.dir) < 0;
    });
    add('字段完整性', bad.length === 0, bad.length ? bad.length + ' 条字段异常' : '全部记录字段正常');

    var cats = {};
    C.getCategories().forEach(function (c) { cats[c.id] = true; });
    var orphan = list.filter(function (t) { return !cats[t.cat]; });
    add('分类引用有效', orphan.length === 0, orphan.length ? orphan.length + ' 条指向不存在的分类' : '全部指向现有分类');

    var ids = {};
    var dupId = 0;
    list.forEach(function (t) { if (ids[t.id]) dupId++; ids[t.id] = true; });
    add('ID 唯一', dupId === 0, dupId ? dupId + ' 个重复 ID' : '无重复');

    var fp = {};
    var dupTx = 0;
    list.forEach(function (t) {
      if (t.deletedAt) return;
      var k = t.fp || (C.fingerprint(t));
      if (fp[k]) dupTx++;
      fp[k] = true;
    });
    add('无重复记账', dupTx === 0, dupTx ? dupTx + ' 条可能重复' : '未发现重复');

    var total = monthStatsTotal();
    add('金额可求和', isFinite(total), '本月合计 ' + C.money(total));

    var future = list.filter(function (t) { return t.ts > Date.now() + 86400000; });
    add('时间合理', future.length === 0, future.length ? future.length + ' 条日期在未来' : '没有未来日期的记录');

    var catsUsed = {};
    list.forEach(function (t) { if (!t.deletedAt) catsUsed[t.cat] = (catsUsed[t.cat] || 0) + 1; });
    add('分类都在用', true, Object.keys(catsUsed).length + ' 个分类有记录');

    return { ok: checks.every(function (c) { return c.pass; }), checks: checks };
  }
